name: Lint

"on":
  push:
    branches: ["**"]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Replaces apt-get install lua5.1 luarocks: apt-get update alone pulls a
      # fresh package index over the network on every run, which was the main
      # source of slow/flaky CI. This builds Lua from source instead, but the
      # action caches that build (buildCache input, on by default) across runs.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      # Pinned so a new luacheck release can't silently change lint results
      # (and start failing PRs) without a deliberate version bump here.
      - name: Install luacheck
        run: luarocks install luacheck 1.2.0

      - name: Run luacheck
        run: luacheck GuildLog.lua GuildLogUI.lua
